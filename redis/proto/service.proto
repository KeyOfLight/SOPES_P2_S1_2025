syntax = "proto3";

package proto;

// Mejor práctica: usar un path de go_package más explícito
option go_package = "/;proto";

service WeatherService {
  rpc SendWeatherData (WeatherRequest) returns (WeatherResponse);
}

message WeatherRequest {
  string Description = 1;
  string Country = 2;
  string Weather = 3;
}

message WeatherResponse {
  string Message = 1;
}