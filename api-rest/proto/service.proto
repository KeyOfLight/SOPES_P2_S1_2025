syntax = "proto3";

package proto;

// Mejor práctica: usar un path de go_package más explícito
option go_package = "grpc-client/proto;proto";

// Servicio definido
service WeatherService {
  rpc SendWeatherData (WeatherRequest) returns (WeatherResponse);
}

// Mensaje de solicitud
message WeatherRequest {
  string description = 1;
  string country = 2;
  string weather = 3;
}

// Mensaje de respuesta
message WeatherResponse {
  string message = 1;
}
