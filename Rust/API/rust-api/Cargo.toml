[package]
name = "rust-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json", "default-tls", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"